  <head>
    <meta charset="utf-8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2b1408" />
    <title>Coffee Nest</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #2b1408;
        overflow: hidden;
      }
      #root {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100dvh;
        display: flex;
        flex: 1;
        background-color: #2b1408;
      }
    </style>
    <script>
      (function () {
        var root = null;
        function getRoot() {
          if (!root) root = document.getElementById('root');
          return root;
        }
        function apply() {
          var el = getRoot();
          if (!el) return;
          var vv = window.visualViewport;
          var h = vv ? Math.round(vv.height) : window.innerHeight;
          el.style.height = h + 'px';
        }
        // Primary: visualViewport resize
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', apply);
          window.visualViewport.addEventListener('scroll', apply);
        }
        // Fallback: window resize
        window.addEventListener('resize', apply);
        // Key fix: when any input loses focus (numeric keyboard dismisses),
        // retry multiple times to catch the delayed height restoration on iOS
        document.addEventListener('focusout', function () {
          setTimeout(apply, 50);
          setTimeout(apply, 200);
          setTimeout(apply, 500);
        });
        // Initial sizing
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', apply);
        } else {
          apply();
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
  </head>
