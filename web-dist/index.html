<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <meta name="theme-color" content="#2b1408" />
    <title>Coffee Nest</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #2b1408;
        overflow: hidden;
      }
      #root {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex: 1;
        background-color: #2b1408;
      }
    </style>
    <script>
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        var root = null;
        function apply() {
          if (!root) root = document.getElementById('root');
          if (!root) return;
          root.style.top = Math.round(vv.offsetTop) + 'px';
          root.style.height = Math.round(vv.height) + 'px';
          root.style.bottom = 'auto';
        }
        vv.addEventListener('resize', apply);
        vv.addEventListener('scroll', apply);
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', apply);
        } else {
          apply();
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
