<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Coffee Nest</title>

    <!-- PWA / iOS status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coffee Nest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme color for browser chrome + Dynamic Island gap -->
    <meta name="theme-color" content="#1A0F08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      html {
        height: 100dvh;
        background-color: #1A0F08;
      }
      body {
        height: 100dvh;
        min-height: -webkit-fill-available;
        background-color: #1A0F08;
        overflow: hidden;
      }
      @media (prefers-color-scheme: light) {
        html, body {
          background-color: #FBF6EE;
        }
      }
      #root {
        display: flex;
        height: 100dvh;
        min-height: -webkit-fill-available;
        flex: 1;
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
